openapi: 3.2.0
info:
  title: kpblog API
  version: 0.1.0
  description: |
    kpblog 后端 JSON API 契约。

    所有 `/api/*` JSON 接口统一使用 envelope:

    - 成功: `{ "success": true, "data": ... }`
    - 失败: `{ "success": false, "error": { "code": "...", "message": "..." } }`

    Web 浏览器通过同域 `/api/*` 访问；Next.js 将请求代理到独立 Fastify
    进程。`/rss.xml` 等由 Web 输出的非 JSON 内容不包含在本文件中。
servers:
  - url: http://localhost:3001
    description: Local same-origin Web proxy
  - url: http://127.0.0.1:3002
    description: Local Fastify API (private)
  - url: https://kpblog.cc
    description: Production
tags:
  - name: Auth
  - name: Articles
  - name: Comments
  - name: Taxonomy
  - name: Media
  - name: Collections
    description: Project collections grouping posts into series.
  - name: Settings
  - name: Publishing
  - name: Public
  - name: Operations
  - name: Profile
  - name: Health

paths:
  /api/public/settings:
    get:
      tags: [Public]
      summary: Get public blog title and description
      responses:
        "200":
          description: Public settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"

  /api/public/profile:
    get:
      tags: [Public]
      summary: Get the site owner's public profile
      description: >-
        Feeds /about, /now and the footer. Every text field may be an
        empty string and both arrays may be empty; the pages render their own
        empty states. Returns empty defaults when nothing has been saved yet.
      responses:
        "200":
          description: Public profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileResponse"

  /api/public/guestbook:
    get:
      tags: [Public]
      summary: List approved guestbook entries
      description: >-
        Guestbook entries are stored in the same table as article comments with a
        null postId, so they share the review pipeline, one-level replies and
        rate limiting. Top-level entries are paginated, newest first (default 20
        per page, maximum 50); each entry carries its approved replies in full.
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Approved guestbook threads
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommentListResponse"

  /api/public/collections:
    get:
      tags: [Public]
      summary: Get the projects page payload
      description: >-
        Backs /projects. One card per project: published-post count and the
        latest publishedAt, sorted by most recent update. Ungrouped posts are
        not part of this payload — /articles is the index for everything.
      responses:
        "200":
          description: Projects page data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectsPageResponse"
  /api/public/home:
    get:
      tags: [Public]
      summary: Get the homepage data (recent posts, categories, tags)
      responses:
        "200":
          description: Homepage content payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HomePageResponse"

  /api/public/article-index:
    get:
      tags: [Public]
      summary: Get the server-rendered article index payload
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
        - name: q
          in: query
          schema:
            type: string
            maxLength: 100
          description: >-
            Keyword filter over title, excerpt and content of published
            articles. The API truncates the value to 100 characters.
        - name: category
          in: query
          schema:
            type: string
          description: Category slug filter (the /articles page filter dropdown).
        - name: tag
          in: query
          schema:
            type: string
          description: Tag slug filter (the /articles page filter dropdown).
      responses:
        "200":
          description: Paginated published articles
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArticleListResponse"

  /api/public/articles/{slug}:
    parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
    get:
      tags: [Public]
      summary: Get a published article by slug
      responses:
        "200":
          description: Published article or null
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"

  /api/public/articles/{slug}/adjacent:
    parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
    get:
      tags: [Public]
      summary: Get previous, next, and related articles for a published article
      responses:
        "200":
          description: Adjacent navigation payload, or null when the slug is unknown
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArticleAdjacentResponse"

  /api/public/tags/{slug}:
    parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
    get:
      tags: [Public]
      summary: Get a tag archive page payload
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Tag metadata and paginated articles
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"

  /api/public/categories/{slug}:
    parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
    get:
      tags: [Public]
      summary: Get a category archive page payload
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Category metadata and paginated articles
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"

  /api/public/collections/{slug}:
    parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
    get:
      tags: [Public]
      summary: Get a project collection page payload
      description: Server-rendered /collections/[collection] page data — the project summary plus a paginated list of its published posts.
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Project page data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CollectionPageResponse"

  /api/public/rss-data:
    get:
      tags: [Public]
      summary: Get data used by the Web RSS route
      responses:
        "200":
          description: Published posts and public settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"

  /api/public/sitemap-data:
    get:
      tags: [Public]
      summary: Get data used by the Web sitemap route
      responses:
        "200":
          description: Published post, tag, and category identifiers
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"

  /api/auth/login:
    post:
      tags: [Auth]
      summary: User or admin login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "403":
          $ref: "#/components/responses/Forbidden"
        "200":
          description: Logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/auth/register:
    post:
      tags: [Auth]
      summary: Register a public user account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterInput"
      responses:
        "403":
          $ref: "#/components/responses/Forbidden"
        "201":
          description: Registered and logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/auth/registration-options:
    get:
      tags: [Auth]
      summary: Get the registration methods available in the current environment
      responses:
        "200":
          description: Email registration availability
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegistrationOptionsResponse"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/auth/verification-code:
    post:
      tags: [Auth]
      summary: Send an email registration verification code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerificationCodeInput"
      responses:
        "403":
          $ref: "#/components/responses/Forbidden"
        "200":
          description: Verification code created and delivered when the selected service is configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerificationCodeResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/auth/password/reset-code:
    post:
      tags: [Auth]
      summary: Send a password reset verification code
      description: >-
        Responds identically whether or not the email is registered, so this
        endpoint cannot be used to enumerate accounts. Rate limited per client
        IP and per target, 5 per hour each.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
      responses:
        "403":
          $ref: "#/components/responses/Forbidden"
        "200":
          description: Code requested
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          description: Rate limited

  /api/auth/password/reset:
    post:
      tags: [Auth]
      summary: Reset a password with an emailed verification code
      description: >-
        No session required. On success every token previously issued to the
        account is revoked (User.tokenVersion is incremented), so all devices
        must sign in again.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, verificationCode, newPassword]
              properties:
                email:
                  type: string
                verificationCode:
                  type: string
                newPassword:
                  type: string
      responses:
        "403":
          $ref: "#/components/responses/Forbidden"
        "200":
          description: Password reset
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          description: Rate limited

  /api/auth/password:
    put:
      tags: [Auth]
      summary: Change your own password
      description: >-
        Requires the current password and an active session. Revokes every other
        token for the account but re-issues one for the calling device, so the
        caller is not signed out by their own password change.
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              properties:
                currentPassword:
                  type: string
                newPassword:
                  type: string
      responses:
        "403":
          $ref: "#/components/responses/Forbidden"
        "200":
          description: Password changed
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/auth/logout:
    post:
      tags: [Auth]
      summary: Clear current session cookie
      description: >-
        Clears the session cookie and revokes the account's issued tokens
        server-side by incrementing User.tokenVersion. Every token previously
        issued to this account becomes invalid immediately, so logging out on
        one device signs the account out everywhere.
      responses:
        "403":
          $ref: "#/components/responses/Forbidden"
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LogoutResponse"

  /api/auth/me:
    get:
      tags: [Auth]
      summary: Get current authenticated user session
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Current admin user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthMeResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/auth/key:
    get:
      tags: [Auth]
      summary: Get current admin API key
      security:
        - sessionCookie: []
      responses:
        "403":
          $ref: "#/components/responses/Forbidden"
        "200":
          description: API key status. The stored key value is not returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiKeyResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [Auth]
      summary: Regenerate current admin API key
      security:
        - sessionCookie: []
      responses:
        "403":
          $ref: "#/components/responses/Forbidden"
        "200":
          description: New API key. This is the only time the raw key is returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiKeyResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/articles:
    get:
      tags: [Articles]
      summary: List articles
      description: |
        Public requests return published articles only.
        Authenticated admin requests can pass `published=all` or `published=draft`.
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
        - name: tag
          in: query
          schema:
            type: string
          description: Filter by tag slug.
        - name: category
          in: query
          schema:
            type: string
          description: Filter by category slug.
        - name: published
          in: query
          schema:
            type: string
            enum: [all, draft, published]
          description: Admin-only publication filter.
        - name: q
          in: query
          schema:
            type: string
            maxLength: 100
          description: >-
            Case-insensitive keyword filter over title, excerpt, content and tag
            names. The API truncates the value to 100 characters.
      responses:
        "200":
          description: Paginated articles
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArticleListResponse"
    post:
      tags: [Articles]
      summary: Create article
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ArticleCreateInput"
      responses:
        "403":
          $ref: "#/components/responses/Forbidden"
        "201":
          description: Article created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PostDetailResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/articles/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [Articles]
      summary: Get article by id
      description: Draft articles require an authenticated admin session.
      responses:
        "200":
          description: Article detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PostDetailResponse"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [Articles]
      summary: Update article
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ArticleUpdateInput"
      responses:
        "403":
          $ref: "#/components/responses/Forbidden"
        "200":
          description: Article updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PostDetailResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      tags: [Articles]
      summary: Delete article
      security:
        - sessionCookie: []
      responses:
        "403":
          $ref: "#/components/responses/Forbidden"
        "200":
          description: Article deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/comments:
    get:
      tags: [Comments]
      summary: List comments
      description: |
        With `postId`, returns approved public comment threads for that post.
        Without `postId`, requires a current database-backed admin session and returns the moderation list.
      parameters:
        - name: postId
          in: query
          schema:
            type: string
        - name: approved
          in: query
          schema:
            type: string
            enum: [pending, approved, "true", "false"]
          description: Admin moderation filter. Ignored when `postId` is provided.
        - name: scope
          in: query
          schema:
            type: string
            enum: [post, guestbook]
          description: >-
            Admin-only source filter. `post` returns article comments, `guestbook`
            returns guestbook entries. Any other value means no filtering.
            Ignored when `postId` is provided.
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Public comment threads or admin comment list
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/CommentListResponse"
                  - $ref: "#/components/schemas/AdminCommentListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [Comments]
      summary: Submit comment
      description: New comments are created with `pendingReview=true` and are hidden until approved.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommentCreateInput"
      responses:
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "201":
          description: Comment submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommentCreateResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/guestbook:
    post:
      tags: [Comments]
      summary: Submit a guestbook entry
      description: >-
        Same validation and moderation queue as article comments, but the entry
        is not attached to any post. Any `postId` in the body is ignored —
        ownership is decided by the endpoint. Rate limit is counted separately
        from article comments (10 per 10 minutes per IP).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GuestbookEntryCreateInput"
      responses:
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "201":
          description: Entry submitted for review
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommentCreateResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/comments/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    put:
      tags: [Comments]
      summary: Approve or reject comment
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommentModerationInput"
      responses:
        "403":
          $ref: "#/components/responses/Forbidden"
        "200":
          description: Comment updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminCommentResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      tags: [Comments]
      summary: Delete comment
      security:
        - sessionCookie: []
      responses:
        "403":
          $ref: "#/components/responses/Forbidden"
        "200":
          description: Comment deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/categories:
    get:
      tags: [Taxonomy]
      summary: List categories
      description: |
        Public list. Counts only published posts; empty categories are kept
        as deliberate navigation placeholders. With an authenticated admin
        session, `all=true` returns the admin variant counting all posts
        including drafts; for everyone else the parameter is ignored.
      parameters:
        - name: all
          in: query
          required: false
          schema:
            type: string
          description: '"true" with an admin session returns the full admin list.'
      responses:
        "200":
          description: Categories
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoryListResponse"
    post:
      tags: [Taxonomy]
      summary: Create category
      description: Admin only. The slug defaults to a slugified version of the name.
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaxonomyCreateInput"
      responses:
        "403":
          $ref: "#/components/responses/Forbidden"
        "201":
          description: Category created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoryMutationResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/categories/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    put:
      tags: [Taxonomy]
      summary: Update category
      description: |
        Admin only. Rename only changes the display name; the slug (and therefore
        the public URL) changes only when a slug field is explicitly supplied.
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaxonomyUpdateInput"
      responses:
        "403":
          $ref: "#/components/responses/Forbidden"
        "200":
          description: Category updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoryMutationResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      tags: [Taxonomy]
      summary: Delete category
      description: |
        Admin only. Posts keep their content; their categoryId is set to null
        by the database foreign key.
      security:
        - sessionCookie: []
      responses:
        "403":
          $ref: "#/components/responses/Forbidden"
        "200":
          description: Category deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/tags:
    get:
      tags: [Taxonomy]
      summary: List tags
      description: |
        Public list: only tags with at least one published post, counting
        published posts. With an authenticated admin session, `all=true`
        returns every tag (including unused ones) counting all posts
        including drafts; for everyone else the parameter is ignored.
      parameters:
        - name: all
          in: query
          required: false
          schema:
            type: string
          description: '"true" with an admin session returns the full admin list.'
      responses:
        "200":
          description: Tags
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TagListResponse"
    post:
      tags: [Taxonomy]
      summary: Create tag
      description: Admin only. The slug defaults to a slugified version of the name.
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaxonomyCreateInput"
      responses:
        "403":
          $ref: "#/components/responses/Forbidden"
        "201":
          description: Tag created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TagMutationResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/tags/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    put:
      tags: [Taxonomy]
      summary: Update tag
      description: |
        Admin only. Rename only changes the display name; the slug (and therefore
        the public URL) changes only when a slug field is explicitly supplied.
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaxonomyUpdateInput"
      responses:
        "403":
          $ref: "#/components/responses/Forbidden"
        "200":
          description: Tag updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TagMutationResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      tags: [Taxonomy]
      summary: Delete tag
      description: |
        Admin only. Posts keep their content; their tag links are removed
        by the cascade on TagOnPost.
      security:
        - sessionCookie: []
      responses:
        "403":
          $ref: "#/components/responses/Forbidden"
        "200":
          description: Tag deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/tags/{id}/merge:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      tags: [Taxonomy]
      summary: Merge tag into another tag
      description: |
        Admin only. Moves every post link from the tag identified by {id}
        (source) to the tag named in the body (target); posts already linked
        to the target are left untouched, then the source tag is deleted.
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaxonomyMergeInput"
      responses:
        "403":
          $ref: "#/components/responses/Forbidden"
        "200":
          description: Merge completed; returns the target tag with its new count
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TagMutationResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/collections:
    get:
      tags: [Collections]
      summary: List project collections
      description: |
        Public list: every project kept as a navigation placeholder, counting
        only published posts. With an authenticated admin session, `all=true`
        returns the admin variant counting all posts including drafts; for
        everyone else the parameter is ignored.
      parameters:
        - name: all
          in: query
          required: false
          schema:
            type: string
          description: '"true" with an admin session returns the full admin list.'
      responses:
        "200":
          description: Project collections
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectListResponse"
    post:
      tags: [Collections]
      summary: Create project collection
      description: Admin only. The slug defaults to a slugified version of the name.
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectInput"
      responses:
        "403":
          $ref: "#/components/responses/Forbidden"
        "201":
          description: Project created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectMutationResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/collections/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    put:
      tags: [Collections]
      summary: Update project collection
      description: |
        Admin only. Rename only changes the display name; the slug (and
        therefore the public URL) changes only when a slug field is
        explicitly supplied. Set coverImage to null to clear it.
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectInput"
      responses:
        "403":
          $ref: "#/components/responses/Forbidden"
        "200":
          description: Project updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectMutationResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      tags: [Collections]
      summary: Delete project collection
      description: |
        Admin only. Posts keep their content; their projectId is set to null
        by the database foreign key, so they fall back to the year groups on
        /archive.
      security:
        - sessionCookie: []
      responses:
        "403":
          $ref: "#/components/responses/Forbidden"
        "200":
          description: Project deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/profile:
    put:
      tags: [Profile]
      summary: Update the site owner's profile
      description: >-
        Admin only. Replaces the whole profile document; omitted text fields
        become empty strings and omitted arrays become empty. Avatar and link
        values must be site-relative paths or http(s) URLs — other schemes
        (javascript:, data:, file:) are rejected.
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileInput"
      responses:
        "200":
          description: Profile updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileResponse"
        "400":
          description: Validation failed
        "401":
          description: Not signed in
        "403":
          description: Signed in but not an admin

  /api/settings:
    get:
      tags: [Settings]
      summary: Get public settings
      responses:
        "200":
          description: Settings map
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettingsResponse"
    put:
      tags: [Settings]
      summary: Update settings
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SettingsUpdateInput"
      responses:
        "403":
          $ref: "#/components/responses/Forbidden"
        "200":
          description: Settings updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdateResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/music:
    get:
      tags: [Media]
      summary: List music tracks
      responses:
        "200":
          description: Music tracks
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MusicListResponse"
    post:
      tags: [Media]
      summary: Upload local music file or add external music URL
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/MusicUploadInput"
          application/json:
            schema:
              $ref: "#/components/schemas/MusicUrlInput"
      responses:
        "403":
          $ref: "#/components/responses/Forbidden"
        "201":
          description: Music track created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MusicResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/music/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    delete:
      tags: [Media]
      summary: Delete music track
      security:
        - sessionCookie: []
      responses:
        "403":
          $ref: "#/components/responses/Forbidden"
        "200":
          description: Music track deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/images:
    get:
      tags: [Media]
      summary: List registered images
      description: >-
        Admin only. The image library may contain unpublished article assets,
        private files, or external URLs with signed query parameters; the public
        site does not read from it. kind selects one bucket (cover or article);
        omit it for both. An unknown kind is rejected with 400.
      security:
        - sessionCookie: []
      parameters:
        - name: kind
          in: query
          required: false
          schema:
            type: string
            enum: [cover, article]
          description: Filter by image kind; omitted means all kinds.
      responses:
        "200":
          description: Registered images
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImageListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [Media]
      summary: Upload an image file or register an external image URL
      description: >-
        Admin only. Multipart uploads store the file under the local image
        library; JSON registers an external http(s) URL (e.g. a GitHub image
        host) without downloading it. Both create a MediaImage entry whose
        url must be unique.
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/ImageUploadInput"
          application/json:
            schema:
              $ref: "#/components/schemas/ImageUrlRegisterInput"
      responses:
        "403":
          $ref: "#/components/responses/Forbidden"
        "201":
          description: Image registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImageResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/images/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    delete:
      tags: [Media]
      summary: Delete a registered image
      description: |
        Admin only. Refuses with 409 while posts still reference the URL
        (covers match Post.coverImage exactly; article images match the body
        markdown). Supplying force=true deletes anyway, leaving the dangling
        references in place — posts are never modified.
      security:
        - sessionCookie: []
      parameters:
        - name: force
          in: query
          required: false
          schema:
            type: string
          description: '"true" deletes even while references remain.'
      responses:
        "403":
          $ref: "#/components/responses/Forbidden"
        "200":
          description: Image deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Still referenced by posts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiFailure"

  /api/images/adopt:
    post:
      tags: [Media]
      summary: Adopt image URLs already used by posts into the library
      description: |
        Admin only. Scans every post: coverImage values become cover entries,
        markdown body image URLs become article entries. Idempotent — URLs
        already registered are skipped, so a repeated run reports zero.
      security:
        - sessionCookie: []
      responses:
        "403":
          $ref: "#/components/responses/Forbidden"
        "200":
          description: Adoption result (newly registered counts)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImageAdoptResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/wallpapers:
    get:
      tags: [Media]
      summary: List homepage wallpapers
      description: |
        Public list returns only enabled wallpapers in rotation order. With an
        authenticated admin session, `all=true` returns every entry including
        disabled ones. First access auto-seeds the repository's default
        wallpapers.
      parameters:
        - name: all
          in: query
          required: false
          schema:
            type: string
          description: '"true" with an admin session includes disabled entries.'
      responses:
        "200":
          description: Wallpapers
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WallpaperListResponse"
    post:
      tags: [Media]
      summary: Upload a homepage wallpaper (JPG/PNG/WebP/GIF/AVIF, max 10MB)
      description: Admin only. Appends the wallpaper to the end of the rotation, enabled.
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/WallpaperUploadInput"
      responses:
        "403":
          $ref: "#/components/responses/Forbidden"
        "201":
          description: Wallpaper added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WallpaperResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/wallpapers/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    put:
      tags: [Media]
      summary: Enable or disable a wallpaper
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WallpaperUpdateInput"
      responses:
        "403":
          $ref: "#/components/responses/Forbidden"
        "200":
          description: Wallpaper updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WallpaperResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Media]
      summary: Remove a wallpaper from the rotation
      description: Admin only. Removes the rotation entry only; the underlying file is kept.
      security:
        - sessionCookie: []
      responses:
        "403":
          $ref: "#/components/responses/Forbidden"
        "200":
          description: Wallpaper removed from rotation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/wallpapers/reorder:
    post:
      tags: [Media]
      summary: Reorder homepage wallpapers
      description: Admin only. Ids are assigned rotation order in the order given; unlisted entries keep their relative order at the end.
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WallpaperReorderInput"
      responses:
        "403":
          $ref: "#/components/responses/Forbidden"
        "200":
          description: Reordered (full admin list)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WallpaperListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/import:
    post:
      tags: [Publishing]
      summary: Import note files
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [files]
              properties:
                files:
                  type: array
                  items:
                    type: string
                    format: binary
      responses:
        "403":
          $ref: "#/components/responses/Forbidden"
        "201":
          description: Import results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/publish:
    post:
      tags: [Publishing]
      summary: Publish Markdown via an active administrator API key
      security:
        - bearerApiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublishInput"
      responses:
        "403":
          $ref: "#/components/responses/Forbidden"
        "201":
          description: Published article
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublishResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"

  /health:
    get:
      tags: [Operations]
      summary: Liveness and readiness probe
      description: >-
        Executes a real query against the database. Returns 503 with
        `status: degraded` when the database is unreachable, so monitoring and
        load balancers can take the instance out of rotation. Never returns
        internal error details — those go to the server log only, correlated by
        the `X-Request-Id` response header.
      responses:
        "200":
          description: Database reachable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "503":
          description: Database unreachable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: session
    bearerApiKey:
      type: http
      scheme: bearer
      bearerFormat: kp API key

  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 10

  responses:
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiFailure"
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiFailure"
    Forbidden:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiFailure"
    TooManyRequests:
      description: Too many requests
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiFailure"
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiFailure"
    Conflict:
      description: Conflict
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiFailure"
    InternalError:
      description: Internal error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiFailure"

  schemas:
    ApiFailure:
      type: object
      required: [success, error]
      properties:
        success:
          type: boolean
          const: false
        error:
          $ref: "#/components/schemas/ApiError"

    ApiError:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          enum: [BAD_REQUEST, UNAUTHORIZED, FORBIDDEN, NOT_FOUND, CONFLICT, TOO_MANY_REQUESTS, INTERNAL_ERROR]
        message:
          type: string
        retryAfterSeconds:
          type: integer
          minimum: 1
          description: >-
            Only present on rate-limit (429) responses: seconds until the caller may
            try again. An ADMIN account allows exactly 3 password attempts: attempts
            1-3 return 401, the 4th is refused before password verification and locks
            the account for 15 minutes (configurable via ADMIN_LOGIN_LOCKOUT_MINUTES).
            Regular accounts allow 10 failures per 15 minutes. The lock follows the
            account, not the IP, so rotating IPs does not clear it.

    LoginInput:
      type: object
      required: [password]
      properties:
        username:
          type: string
        identifier:
          type: string
          description: Username or email.
        email:
          type: string
          format: email
        password:
          type: string
          format: password

    RegisterInput:
      type: object
      required: [username, email, verificationCode, password]
      properties:
        username:
          type: string
          minLength: 2
          maxLength: 32
        displayName:
          type:
            - string
            - "null"
          maxLength: 32
        email:
          type: string
          format: email
        verificationCode:
          type: string
          pattern: "^\\d{6}$"
        password:
          type: string
          format: password
          minLength: 8

    VerificationCodeInput:
      type: object
      required: [target]
      properties:
        target:
          type: string
          description: Email address to receive the code.

    VerificationCodeResponse:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data:
              type: object
              required: [sent, target, expiresAt]
              properties:
                sent:
                  type: boolean
                  description: True when a message was delivered; false only in development fallback mode.
                target:
                  type: string
                expiresAt:
                  type: string
                  format: date-time
                debugCode:
                  type: string
                  description: Returned only in development when the selected delivery service is not configured.

    RegistrationOptionsResponse:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data:
              type: object
              required: [email]
              properties:
                email:
                  type: boolean

    SessionUser:
      type: object
      required: [authenticated, username, displayName, role]
      properties:
        authenticated:
          type: boolean
          const: true
        username:
          type: string
        displayName:
          type:
            - string
            - "null"
        role:
          type: string
          enum: [ADMIN, USER]

    LoginResponse:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data:
              type: object
              required: [loggedIn, user]
              properties:
                loggedIn:
                  type: boolean
                  const: true
                user:
                  $ref: "#/components/schemas/SessionUser"

    LogoutResponse:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data:
              type: object
              required: [loggedOut]
              properties:
                loggedOut:
                  type: boolean
                  const: true

    AuthMeResponse:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/SessionUser"

    ApiKeyResponse:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data:
              type: object
              required: [hasApiKey, apiKey]
              properties:
                hasApiKey:
                  type: boolean
                apiKey:
                  type:
                    - string
                    - "null"
                  description: Present only immediately after regeneration.

    Envelope:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          const: true
        data: {}

    DeleteResponse:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data:
              type: object
              required: [deleted]
              properties:
                deleted:
                  type: boolean
